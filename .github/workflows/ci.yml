name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Contract + unit tests
        env:
          PYTHONPATH: packages:services
        run: pytest tests/contract tests/test_common.py tests/test_api_smoke.py -q
      - name: Verify (offline parts)
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/verify_mvp.sh

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Compose up
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8010/v1/health && break
            sleep 5
          done
          curl -sf http://localhost:8010/v1/health
      - name: Verify MVP
        run: bash scripts/verify_mvp.sh
      - name: Compose down
        if: always()
        run: docker compose down -v
