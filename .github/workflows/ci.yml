name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Contract + unit tests
        env:
          PYTHONPATH: packages:services
        run: |
          pytest tests/contract tests/test_common.py tests/test_api_smoke.py \
            tests/test_alerts.py tests/test_history_fixture.py tests/test_fetch_presupuesto.py \
            tests/test_pipeline_resilience.py tests/test_cross_source.py \
            tests/test_discrepancies_integration.py tests/test_data_quality_g1.py \
            tests/test_product_gate_g10.py tests/test_entity_geo.py tests/test_mefp_geo.py \
            tests/test_fire_classify.py tests/test_fire_classify_golden.py \
            tests/test_fire_ledger_f1.py tests/test_fire_phase_scripts.py \
            tests/test_fire_rollup.py tests/test_fire_alerts_f13.py \
            tests/test_fire_capability.py tests/test_fire_gaceta_adapters.py \
            tests/test_fire_geo_bbox.py tests/test_fire_sernap_extract.py \
            tests/test_fire_api.py tests/test_sicoes_resilience.py tests/test_fire_demo_argv.py \
            tests/test_env_validate.py tests/test_presupuesto_corpus_seed.py \
            tests/test_staging_seed.py \
            tests/test_go_live_check.py tests/test_web_download_urls.py -q
      - name: Go-live + MEFP + web URL regression
        env:
          PYTHONPATH: packages:services
        run: |
          pytest tests/test_go_live_check.py tests/test_mefp_geo.py \
            tests/test_web_download_urls.py tests/test_staging_seed.py -q
      - name: Verify (offline parts)
        env:
          SKIP_DOCKER: "1"
        run: bash scripts/verify_mvp.sh

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web deps
        working-directory: services/web
        run: npm install
      - name: next build
        working-directory: services/web
        env:
          NEXT_PUBLIC_API_URL: http://api.example:8010
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [test, web-build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Compose up
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8010/v1/health && break
            sleep 5
          done
          curl -sf http://localhost:8010/v1/health
      - name: Verify MVP
        run: bash scripts/verify_mvp.sh
      - name: Compose down
        if: always()
        run: docker compose down -v
