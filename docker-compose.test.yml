# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm test
services:
  test:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    # Override API entrypoint (migrate+uvicorn) — this service only runs pytest.
    entrypoint: ["/bin/sh", "-c"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gasto:gasto_dev_change_me@postgres:5432/gasto_abierto
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "0"
      MINIO_ENABLED: "1"
      LIVE_SCRAPE: "0"
      REQUIRE_PROXY_FOR_LIVE: "1"
      PYTHONPATH: /app/packages:/app/services
      # Pass-through proxy if you set it on the host .env (never required for offline tests)
      PROXY_URL: ${PROXY_URL:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      - |
        set -e
        sh /app/scripts/run_docker_tests.sh

