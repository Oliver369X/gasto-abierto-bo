services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gasto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gasto_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-gasto_abierto}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gasto} -d ${POSTGRES_DB:-gasto_abierto}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_HOST_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9011}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    profiles: ["storage"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/gasto-raw || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gasto:gasto_dev_change_me@postgres:5432/gasto_abierto
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "0"
      MINIO_ENABLED: ${MINIO_ENABLED:-0}
      REQUIRE_PROXY_FOR_LIVE: ${REQUIRE_PROXY_FOR_LIVE:-1}
      PROXY_URL: ${PROXY_URL:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
    ports:
      - "${API_HOST_PORT:-8010}:${API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gasto:gasto_dev_change_me@postgres:5432/gasto_abierto
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "0"
      MINIO_ENABLED: ${MINIO_ENABLED:-0}
      LIVE_SCRAPE: ${LIVE_SCRAPE:-0}
      REQUIRE_PROXY_FOR_LIVE: ${REQUIRE_PROXY_FOR_LIVE:-1}
      PROXY_URL: ${PROXY_URL:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${API_HOST_PORT:-8010}  # pragma: allowlist secret
    environment:
      API_INTERNAL_URL: http://api:${API_PORT:-8000}
      NEXT_PUBLIC_API_URL: http://127.0.0.1:${API_HOST_PORT:-8010}  # pragma: allowlist secret
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_HOST_PORT:-3010}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  pgdata:
  miniodata:
